name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency review (npm audit high+)
        run: npm audit --audit-level=high

      - name: Secret scan (tracked files)
        working-directory: .
        run: |
          set -euo pipefail
          forbidden_patterns='(AIza[0-9A-Za-z\-_]{35}|xox[baprs]-|ghp_[A-Za-z0-9]{36}|GEMINI_API_KEY\s*=\s*[A-Za-z0-9._\-]{20,}|api[_-]?key\s*[:=]\s*[A-Za-z0-9._\-]{20,})'
          matches="$(git grep -nIE "$forbidden_patterns" -- ":!**/.env.example" ":!**/.env.local" ":!**/package-lock.json" || true)"
          if [ -n "$matches" ]; then
            filtered_matches="$(printf '%s\n' "$matches" | sed -E '/(replace_with|placeholder|dummy|example|your[_-]?api[_-]?key|test[_-]?key)/Id')"
            if [ -n "$filtered_matches" ]; then
              printf '%s\n' "$filtered_matches"
              echo "Potential hardcoded secret detected."
              exit 1
            fi
          fi

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
