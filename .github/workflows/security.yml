name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node.js
        uses: actions/setup-node@8c91899e586c5b171469028bd8b7f6d5c708d22c
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency review (npm audit high+)
        run: npm audit --audit-level=high

      - name: Secret scan (tracked files)
        working-directory: .
        run: |
          set -euo pipefail
          forbidden_patterns='(AIza[0-9A-Za-z\-_]{35}|xox[baprs]-|ghp_[A-Za-z0-9]{36}|GEMINI_API_KEY\s*=\s*[A-Za-z0-9._\-]{20,}|api[_-]?key\s*[:=]\s*[A-Za-z0-9._\-]{20,})'
          if git grep -nIE "$forbidden_patterns" -- ":!**/.env.example" ":!**/.env.local" ":!**/package-lock.json"; then
            echo "Potential hardcoded secret detected."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
